#!/usr/bin/env ansible-playbook
# ============================================================
#  Author: chusiang / chusiang.lai (at) gmail.com
#  Filename: deploy-wordpress-nginx.yml
#  Modified: 2016-03-10 23:29
#  Description:
#
#   deploy wordpress with Nginx + php5-fpm + MariaDB on Debian/Ubuntu.
#
#  Reference:
#
#   1. ansible print debug msg variable - Server Fault
#    - http://serverfault.com/questions/695786/ansible-print-debug-msg-variable
#   2. ansible/ansible-examples/wordpress-nginx | GitHub
#    - https://github.com/ansible/ansible-examples/tree/master/wordpress-nginx
#
# ============================================================
---

- name: install php-fpm
  hosts: all
  tasks:

    - name: install packages
      become: true
      apt:
        name: "{{ item }}"
        update_cache: yes
        state: latest
        cache_valid_time: 3600
      with_items:
        - php-cli
        - php-common
        - php-fpm
        - php-mysql
        - php-readline

    - name: check version
      command: dpkg-query -W php-fpm
      register: dpkg_package_version

    - name: print version
      debug:
        msg: "php-fpm Version: {{ dpkg_package_version.stdout }}"

    - name: modify php.ini
      become: true
      template:
        src: templates/php.ini.j2
        dest: /etc/php/8.3/fpm/php.ini
      notify:
        - restart php-fpm

    - name: start php-fpm
      become: true
      service:
        name: php8.3-fpm
        state: started
        enabled: yes

  handlers:

    - name: restart php-fpm
      become: true
      service:
        name: php5-fpm
        state: restarted

- name: install nginx
  hosts: all
  vars:
    conf_file: /etc/nginx/sites-available/default

  tasks:

    - name: install packages
      become: true
      apt:
        name: nginx
        update_cache: yes
        state: latest
        cache_valid_time: 3600

    - name: check version
      command: dpkg-query -W nginx
      register: dpkg_package_version

    - name: print version
      debug:
        msg: "Nginx Version: {{ dpkg_package_version.stdout }}"

    - name: modify nginx.conf
      become: true
      template:
        src: templates/nginx/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify:
        - restart nginx

    - name: backup origin vhost
      become: true
      copy:
        src: "{{ conf_file }}"
        dest: /etc/nginx/sites-available/default.ori
        remote_src: yes
      notify:
        - restart nginx

    - name: add vhost
      become: true
      template:
        src: templates/nginx/wordpress.j2
        dest: "{{ conf_file }}"
      notify:
        - restart nginx

    - name: enable vhost
      become: true
      file:
        src: "{{ conf_file }}"
        dest: /etc/nginx/sites-enabled/default
        state: link

    - name: start nginx
      become: true
      service:
        name: nginx
        state: started
        enabled: yes

  handlers:

    - name: restart nginx
      become: true
      service: name=nginx state=restarted

